# nginx vhost for Zato Engineering (zatoengineering.co.za) on the shared VPS.
# Pure static site: Next.js `output: 'export'` build, published to
# /opt/zatoengineering/www by deploy/deploy-app.sh. No Node service, no port.
# Live copy: /etc/nginx/conf.d/zatoengineering.conf
#
# Installed as port 80 only. After DNS points at the VPS, run:
#   sudo certbot --nginx -d zatoengineering.co.za -d www.zatoengineering.co.za
# certbot then adds the 443 block and the http->https redirect to the live file.

server {
    listen 80;
    listen [::]:80;
    server_name zatoengineering.co.za www.zatoengineering.co.za;

    root /opt/zatoengineering/www;
    index index.html;

    # Hashed build assets never change content.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /about -> about.html, /about/ -> about/index.html (export writes both styles).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
